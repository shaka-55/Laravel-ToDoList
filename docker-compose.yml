services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app

    # ⬇️ ports を追加し、5173 をこちらに繋ぎます！
    ports:
      - "5173:5173"
    volumes:
      - ./src:/var/www
    networks:
      - laravel
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: laravel-web
    ports:
      - "8080:80"   # ⚠️ web 側は 8080 だけにします（5173は削除）
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel-db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  db_data: